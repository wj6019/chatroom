name: Build Chatroom

on:
  push:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Generate dependencies
      run: go mod tidy

    - name: Install CGO dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev

    - name: Build Linux amd64 for Ubuntu 20.04
      run: |
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o chatroom main.go

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: chatroom-linux-ubuntu20
        path: chatroom

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Generate dependencies
      run: go mod tidy

    - name: Build Windows amd64
      run: |
        go build -o chatroom.exe main.go

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: chatroom-windows
        path: chatroom.exe
