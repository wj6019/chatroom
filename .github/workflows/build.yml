name: Build Chatroom

# 仅手动触发：在 GitHub 仓库 Actions 页面选择本工作流，点击 "Run workflow"
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Generate dependencies
        run: go mod tidy

      - name: Build Linux amd64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o chatroom .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-linux-amd64
          path: chatroom

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Generate dependencies
        run: go mod tidy

      - name: Build Windows amd64
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o chatroom.exe .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatroom-windows-amd64
          path: chatroom.exe
