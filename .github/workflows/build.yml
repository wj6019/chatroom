name: Build Chatroom

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ 拉代码
    - name: Checkout
      uses: actions/checkout@v4

    # 2️⃣ 安装 Go
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 3️⃣ 生成 go.sum（关键修复）
    - name: Generate dependencies
      run: go mod tidy

    # 4️⃣ 构建 Linux
    - name: Build Linux amd64
      run: |
        GOOS=linux GOARCH=amd64 go build -o chatroom main.go

    # 5️⃣ 构建 Windows
    - name: Build Windows amd64
      run: |
        GOOS=windows GOARCH=amd64 go build -o chatroom.exe main.go

    # 6️⃣ 上传构建产物
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chatroom-binaries
        path: |
          chatroom
          chatroom.exe
